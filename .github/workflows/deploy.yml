name: Deploy web site

# Required repository secrets (set in Settings → Secrets → Actions):
#   RESOURCES_REPO_TOKEN  — fine-grained PAT or classic token with `repo:read`
#                           scope for the public resources repository.
#                           Only required if the public repo is private.
#                           If the public repo is public, the step will work
#                           without a token (unauthenticated raw download).

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Generate resources catalog locally ───────────────────────────────
      - name: Generate resources catalog
        env:
          RESOURCES_REPOSITORY: "jmanriquerios1/power-platform-resources"
        run: node scripts/generate-resources-json.mjs

      - name: Rewrite catalog URLs to absolute references
        env:
          PUBLIC_REPO_BASE_URL: "https://raw.githubusercontent.com/jmanriquerios1/power-platform-resources/main"
        run: node scripts/rewrite-catalog-urls.mjs

      # ── Build content index (blog + videos) ───────────────────────────────
      - name: Sync YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL_HANDLE: "@JonathanManriqueRios"
        run: node scripts/import-youtube-rss.js

      - name: Build content index
        run: node scripts/build-content-index.js

      # ── Upload Pages artifact ─────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
