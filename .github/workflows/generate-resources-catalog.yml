name: Generate resource catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate resources catalog
        env:
          # Override RESOURCES_ROOT to point at a different directory when this
          # script runs in the separated public repo (where resources live at the
          # repo root instead of under resources/).  Leave unset to use the
          # default (resources/ subfolder of the current repo).
          RESOURCES_ROOT: ""
        run: node scripts/generate-resources-json.mjs

      - name: Rewrite catalog URLs to absolute references
        env:
          # Base URL for documentation and image links in the generated catalog.
          # After repo separation point this to the public repo's raw URL or
          # GitHub Pages URL so the web site can resolve them without local files.
          PUBLIC_REPO_BASE_URL: "https://raw.githubusercontent.com/jmanriquerios1/power-platform-resources/main"
        run: node scripts/rewrite-catalog-urls.mjs

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- assets/data/resources.json; then
            echo "No catalog changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/resources.json
          git commit -m "chore: regenerate resources catalog"
          git push
